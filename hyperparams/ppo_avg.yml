  sde_sample_freq: 4



PerturbAnt-v4: &mujoco-defaults
  n_timesteps: !!float 2e6
  num_clients: 5
  local_steps: 512
  server_update_weight: 1.0

  n_envs: 1
  batch_size: 16
  n_steps: 512
  normalize: true
  policy: 'MlpPolicy'


PerturbHalfCheetah-v4:
  n_timesteps: !!float 2e6
  num_clients: 5
  local_steps: 512
  server_update_weight: 1.0

  normalize: true
  n_envs: 1
  policy: 'MlpPolicy'
  batch_size: 16
  n_steps: 512
  gamma: 0.98
  learning_rate: 2.0633e-05
  ent_coef: 0.000401762
  clip_range: 0.1
  n_epochs: 20
  gae_lambda: 0.92
  max_grad_norm: 0.8
  vf_coef: 0.58096
  policy_kwargs: "dict(
                    log_std_init=-2,
                    ortho_init=False,
                    activation_fn=nn.ReLU,
                    net_arch=dict(pi=[256, 256], vf=[256, 256])
                  )"


PerturbHopper-v4:
  n_timesteps: !!float 2e6
  num_clients: 5
  local_steps: 512
  server_update_weight: 1.0

  policy: MlpPolicy
  n_envs: 8
  n_steps: 64        # local_steps=2048 추천일 때
  batch_size: 256
  learning_rate: !!float 3e-4
  ent_coef: 0.0
  clip_range: 0.2
  n_epochs: 10
  gae_lambda: 0.95
  gamma: 0.99
  max_grad_norm: 0.5
  vf_coef: 0.5
  policy_kwargs: "dict(log_std_init=0, ortho_init=False, activation_fn=nn.ReLU, net_arch=dict(pi=[256, 256], vf=[256, 256]))"


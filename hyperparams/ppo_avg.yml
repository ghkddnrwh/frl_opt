


PerturbAcrobot-v1:
  n_timesteps: !!float 1e5
  num_clients: 5
  local_steps: 16
  server_update_weight: 1.0

  batch_size: 16
  n_steps: 16
  n_envs: 1
  normalize: true
  policy: 'MlpPolicy'
  gae_lambda: 0.94
  gamma: 0.99
  n_epochs: 4
  ent_coef: 0.0


PerturbCartPole-v1:
  # 2e6 was reliable but unnecessarily long for the nominal CartPole case.
  # The Codex nominal search found a faster solved setting at 1e6 with the
  # same stable optimization core (sw=1.0, gamma=0.98, gae=0.8, lr=3e-4,
  # clip=lin_0.2), while nearby variants such as n_epochs=20 also remained
  # strong.
  n_timesteps: !!float 1e6
  num_clients: 5
  local_steps: 256
  server_update_weight: 1.0

  batch_size: 32
  n_envs: 2
  n_steps: 128
  policy: 'MlpPolicy'
  gae_lambda: 0.8
  gamma: 0.98
  n_epochs: 10
  ent_coef: 0.0
  learning_rate: !!float 3e-4
  clip_range: lin_0.2




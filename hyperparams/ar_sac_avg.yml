
PerturbHalfCheetah-v4: &mujoco-defaults
  n_timesteps: !!float 1e6
  num_clients: 5
  local_steps: 100
  server_update_weight: 1.0
  eval_round_freq: 50
  
  batch_size: 64
  buffer_size: 100_000
  learning_starts: 10000
  policy: 'MlpPolicy'
  policy_kwargs: "dict(n_critics=1)"

PerturbAnt-v4:
  <<: *mujoco-defaults

PerturbHopper-v4:
  <<: *mujoco-defaults

PerturbWalker2d-v4:
  <<: *mujoco-defaults

PerturbHumanoid-v4:
  <<: *mujoco-defaults
  n_timesteps: !!float 2e6

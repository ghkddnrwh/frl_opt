# Fed-AMPO-PPO defaults.
#
# Main ablation knobs:
#   dual_update_mode: adaptive | uniform
#     - adaptive: paper AMPO projected dual update.
#     - uniform: fixes lambda_k = 1 / K every round.
#   critic_sync_mode: local | fedavg | actor_like
#     - local: paper default, keep each critic client-local.
#     - fedavg: average final critic parameters on the server.
#     - actor_like: aggregate critic deltas with the same lambda weights as actor gradients.
#   vecnormalize_sync_mode: none | obs | reward | obs_reward
#     - VecNormalize statistics are merged as RunningMeanStd state, not as gradients.
#   dual_return_source: raw | normalized
#     - raw keeps the dual update aligned with environment returns even when reward normalization is enabled.

PerturbLunarLander-v3:
  # n_timesteps: !!float 4e6
  n_timesteps: !!float 1e6
  num_clients: 5
  local_steps: 32
  server_update_weight: 1.0
  dual_lr: 1e-4
  dual_update_mode: adaptive
  critic_sync_mode: local
  vecnormalize_sync_mode: obs_reward
  dual_return_source: raw
  # server_actor_lr: !!float 1e-3
  # actor_gradient_mode: cumulative

  batch_size: 8
  n_envs: 4
  n_steps: 8
  policy: 'MlpPolicy'
  gae_lambda: 0.98
  gamma: 0.999
  n_epochs: 4
  ent_coef: 0.01



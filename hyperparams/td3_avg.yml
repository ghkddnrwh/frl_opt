PerturbPendulum-v1:
  # global / federated
  n_timesteps: 40000
  num_clients: 5
  local_steps: 1000
  server_update_weight: 1.0

  # local / per-client TD3
  batch_size: 64
  buffer_size: 20000
  learning_starts: 1000
  policy: "MlpPolicy"
  gamma: 0.98
  noise_type: "normal"
  noise_std: 0.1
  gradient_steps: 1
  train_freq: 1
  learning_rate: !!float 1e-3
  policy_kwargs: "dict(net_arch=[400, 300])"
  eval_nominal_episodes: 10
  eval_local_episodes: 10


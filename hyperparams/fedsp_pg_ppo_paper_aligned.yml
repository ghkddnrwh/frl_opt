PerturbPendulum-v1:
  # Federated parameters
  n_timesteps: !!float 1e7
  num_clients: 5
  local_steps: 128
  server_update_weight: 1.0
  # Paper-aligned AMPO uses raw returns in the simplex step, so the effective
  # dual update scale grows with the environment reward magnitude.
  dual_lr: 1e-4
  server_actor_optimizer: adam
  actor_gradient_mode: cumulative
  # Separate server actor step size for theta <- theta + eta_pi * g.
  # With cumulative gradients, this should usually be smaller than the local critic PPO lr.
  server_actor_lr: !!float 1e-3

  batch_size: 64
  n_envs: 4
  n_steps: 32
  policy: "MlpPolicy"
  gae_lambda: 0.95
  gamma: 0.9
  n_epochs: 10
  ent_coef: 0.0
  # Keep the paper-style server update, but use the cumulative PPO actor
  # gradient across local minibatches/epochs instead of averaging it away.
  learning_rate: !!float 1e-3
  clip_range: 0.2
  use_sde: True
  sde_sample_freq: 4

PerturbCartPole-v1:
  # 2e6 was reliable but unnecessarily long for the nominal CartPole case.
  # The Codex nominal search found a faster solved setting at 1e6 with the
  # same stable optimization core (sw=1.0, gamma=0.98, gae=0.8, lr=3e-4,
  # clip=lin_0.2), while nearby variants such as n_epochs=20 also remained
  # strong.
  n_timesteps: !!float 1e6
  num_clients: 5
  local_steps: 256
  server_update_weight: 1.0
  dual_lr: 1e-4
  server_actor_optimizer: adam
  server_actor_lr: !!float 3e-4
  actor_gradient_mode: cumulative

  batch_size: 32
  n_envs: 2
  n_steps: 128
  policy: 'MlpPolicy'
  gae_lambda: 0.8
  gamma: 0.98
  n_epochs: 10
  ent_coef: 0.0
  learning_rate: !!float 3e-4
  clip_range: lin_0.2





PerturbPendulum-v1:
  n_timesteps: !!float 1e6
  num_clients: 5
  local_steps: 128
  server_update_weight: 1.0

  policy: "MlpPolicy"
  n_envs: 4
  n_steps: 32
  batch_size: 64
  gae_lambda: 0.95
  gamma: 0.9
  n_epochs: 10
  ent_coef: 0.0
  learning_rate: !!float 1e-3
  clip_range: 0.2
  use_sde: true
  sde_sample_freq: 4

  dual_lr: !!float 1e-4
  server_actor_lr: !!float 5e-4
  server_actor_optimizer: adam
  actor_gradient_mode: cumulative

  # Decouple the server actor-update cadence from large local_steps settings.
  fedsp_rollout_steps: 32
  max_local_steps_per_round: 128
  local_gradient_aggregation: mean

  # Smooth worst-client approximation for the max-min objective.
  dual_mode: softmin_ema
  dual_temperature: 0.7
  dual_ema: 0.9
  lambda_mix: 0.35
  min_lambda: 0.03
  return_scale_floor: 1.0
  server_gradient_scale: 1.0
  server_gradient_clip: 0.0
  actor_update_estimator: ppo_delta
  server_update_rule: direct_delta
  server_delta_scale: 0.5

  eval_local_episodes: 10
  eval_nominal_episodes: 10
  eval_round_freq: 40
  eval_deterministic: true
